<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadisticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page">
        <section class="card" aria-labelledby="page-title">
            <div class="eyebrow">Ejercicio 6105_3</div>
            <h1 id="page-title">Estadisticas</h1>
            <p class="intro">Calcula las estadisticas principales (sumatorio, promeio, mayor y menor) de una lista.</p>

            <form method="POST" class="number-form">
                <label for="lista">Introduce la lista de números</label>
                <div class="form-controls">
                    <input type="text" id="lista" name="lista" required>
                        <button type="submit">Calcular</button>
                </div>
                
                </div>
            </form>

            {% if result %}
                <section class="result" aria-live="polite" aria-labelledby="result-title">
                    <h2 id="result-title">Resultado</h2>
                    <div class="result-values">
                        <p>{{ lista }}</p>
                        <p>{{ result }}</p>                       <p><span>Exponente</span><strong>{{ exponente }}</strong></p>
                        
                    </div>
                </section>
            {% endif %}
        </section>
    </main>
</body>
</html>
